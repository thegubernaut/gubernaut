name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hardened 2026-09-24: read-only token, a timeout on every job, and every action pinned to the
# commit of the newest release inside the major it already used (a major bump is a change of its
# own, shown green by a CI run). Dependabot proposes the next pin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q
      - name: ruff (reported, not blocking)
        # 17 findings on 2026-09-24, none of them a failing test. Reported until a cleanup lands
        # as its own change; then this step drops continue-on-error.
        if: matrix.python == '3.12'
        continue-on-error: true
        run: pip install ruff && ruff check .

  rust:
    name: rust + wasm target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        # Pinned to the compiler that built the wasm core-js embeds (rustc 1.97.1, 8bab26f4f,
        # named inside the blob). A newer stable emits different bytes for the same source:
        # 1.98.0 gives df1f277f..., embed_wasm.mjs refuses it, and the embed check below has
        # failed on every run since stable became 1.98.0 (2026-08-18). Moving this pin means
        # re-embedding, which re-runs the parity corpus and the soak and says so in CHANGELOG.md.
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/rust
      - name: cargo test
        # 73 value-exact golden steps + 8 boundary rejections against the
        # Python reference.
        run: cargo test
      - name: clippy, warnings as errors
        # Clean on 2026-09-24 with -D warnings, so it blocks from the start.
        run: cargo clippy --all-targets -- -D warnings
      - name: rustfmt (reported, not blocking)
        # Not clean today. Reformatting the crate is its own reviewed change: it can move the panic
        # locations compiled into the wasm that core-js embeds, and the embed check below would then
        # fail for a whitespace edit. Until that change lands this step reports and passes.
        continue-on-error: true
        run: cargo fmt --check
      - name: build wasm32
        run: cargo build --release --target wasm32-unknown-unknown
      - name: the gcc-core deprecation shim still forwards
        # A shim that compiles but re-exports nothing useful looks green and
        # breaks on the first real dependent, so its test imports through the
        # OLD path and asserts a decision plus the numeric boundary.
        working-directory: packages/rust-shim
        run: cargo test
      - name: the wasm @gubernaut/core embeds must match a fresh crate build
        # This lives in the RUST job, not the core-js one, because it needs the
        # wasm32 target. The first version of it sat in core-js, which installs
        # Node and no Rust, and failed with "can't find crate for std" on both
        # Node versions. It passed locally, where the target happens to be
        # installed. CI earning its keep.
        #
        # What it protects: the controller is base64 inlined into core-js. If
        # someone regenerates it from a changed crate, the parity corpus, the
        # 10,000-tick soak and every published latency figure stop describing
        # what ships. embed_wasm.mjs already refuses a digest change; this
        # catches the other direction, a committed blob that no longer matches
        # its source.
        working-directory: packages/core-js
        run: |
          node tools/embed_wasm.mjs
          git diff --quiet -- src/wasm-bytes.ts || {
            echo "::error::The embedded wasm differs from a fresh crate build."
            git diff --stat -- src/wasm-bytes.ts
            exit 1; }
          echo "embedded wasm matches the crate build"

  parity:
    name: golden traces are current
    # If the Python controller moved and the golden corpus was not
    # regenerated, the two languages have silently diverged. This catches it
    # at the source rather than waiting for cargo test to fail cryptically.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: packages/python
      - run: python tools/gen_golden_traces.py
        working-directory: packages/python
      - name: traces must be unchanged
        run: |
          if ! git diff --quiet -- packages/rust/tests/golden/traces.jsonl; then
            echo "::error::The golden traces regenerate differently than committed."
            echo "The Python controller changed without regenerating the corpus."
            echo "Run: cd packages/python && python tools/gen_golden_traces.py"
            git diff --stat -- packages/rust/tests/golden/traces.jsonl
            exit 1
          fi
          echo "golden traces current"

  core-js:
    name: core-js node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same split as the node job below: dist/ is the promise made to the engine
    # floor, and the .ts test suite needs native type stripping (Node >= 22.6).
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    defaults:
      run:
        working-directory: packages/core-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/core-js/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: the built artifact must govern, not merely load
        # A load check would pass on a package whose wasm failed to
        # instantiate, since the failure is inside an async call nobody made.
        # Drive a saturating loop and require the escalation.
        run: |
          node -e "import('./dist/index.js').then(async m => {
            const g = await m.Governor.create();
            const seq = [[0.9,-0.9,0.9],[0.9,-0.9,0.95],[0.9,-0.9,0.98]];
            const out = seq.map(([i,v,r]) => g.tick({intensity:i,valence:v,repetition:r}).posture);
            if (out[out.length-1] !== 'REGROUND') { console.error('no REGROUND:', out); process.exit(1); }
            if (m.wasmDigest !== '834015d73e6576d6c597b5a32a62c24ac56a50c7023261bf84b96beb01ded7d8') {
              console.error('embedded controller is not the verified binary'); process.exit(1); }
            console.log('dist/index.js governs on node ' + process.version + ': ' + out.join(' -> '));
          }).catch(e => { console.error(e.message); process.exit(1); })"
      - name: require() the CJS build too
        run: node -e "const m=require('./dist/index.cjs'); m.Governor.create().then(g=>{const d=g.tick({intensity:0,valence:0,repetition:0}); if(d.posture!=='DEFAULT') process.exit(1); console.log('dist/index.cjs governs');}).catch(e=>{console.error(e.message);process.exit(1)})"
      # The "embedded wasm matches a fresh crate build" check needs the wasm32
      # target and therefore lives in the `rust` job, which already has it.
      - name: parity and soak (needs native type stripping, Node >= 22.6)
        if: matrix.node != '20'
        run: npm test
      - run: npm run typecheck

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two different claims, tested separately.
    #
    # `engines: >=18` is a promise about the PUBLISHED artifact, which tsup
    # compiles to plain JS targeting node18. That promise is kept or broken by
    # dist/, so dist/ is what gets loaded on the floor version.
    #
    # The test suite is a different thing: it imports the .ts sources directly
    # through `node --test`, which needs native type stripping and therefore
    # Node >= 22.6. The first version of this job ran `npm test` on Node 20 and
    # failed with ERR_UNKNOWN_FILE_EXTENSION, because it had only ever been run
    # on a machine with a much newer Node. Raising the floor to hide that would
    # have weakened a real claim to make a badge green.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: the published artifact must load on the declared engine floor
        # Both name sets are checked. The gcc* names are the published 1.0.0
        # surface and dropping one would break every existing dependent; the
        # gubernaut* names are the 1.0.1 aliases the docs now lead with, and an
        # alias missing from the BUILD would pass the source tests and still
        # ship broken.
        run: |
          node -e "import('./dist/index.js').then(m => {
            const need = ['gccPlugin', 'callGcc', 'loadConfig', 'gubernautPlugin', 'callGubernaut'];
            const missing = need.filter(k => !(k in m));
            if (missing.length) { console.error('missing exports:', missing); process.exit(1); }
            if (m.gubernautPlugin !== m.gccPlugin) { console.error('gubernautPlugin is not gccPlugin'); process.exit(1); }
            if (m.callGubernaut !== m.callGcc) { console.error('callGubernaut is not callGcc'); process.exit(1); }
            console.log('dist/index.js loads on node ' + process.version);
          }).catch(e => { console.error(e.message); process.exit(1); })"
      - name: require() the CJS build too
        run: node -e "const m=require('./dist/index.cjs'); if(!m.gccPlugin||!m.gubernautPlugin) process.exit(1); if(m.gubernautPlugin!==m.gccPlugin) process.exit(1); console.log('dist/index.cjs loads')"
      - name: test suite (needs native type stripping, Node >= 22.6)
        if: matrix.node != '20'
        run: npm test
      - run: npm run typecheck

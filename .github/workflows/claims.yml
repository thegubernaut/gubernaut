name: claims

# The numbers gate. Every published figure in this project is a script output,
# and the rules that keep them honest were enforced only by attention until
# 2026-08-01. Attention published $0.1670 for a value scored at $0.1669.
#
# Runs on documentation and source alike, because a wrong number in a docstring
# is still a wrong number.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hardened 2026-09-24: read-only token, a timeout on every job, and every action pinned to the
# commit of the newest release inside the major it already used (a major bump is a change of its
# own, shown green by a CI run). Dependabot proposes the next pin.
permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove the gate fires
        # A green gate that cannot fail is not a gate. This asserts each rule
        # catches its defect AND stays silent on the legitimate near-miss:
        # "provenance" must not trip "proven", and the required disclaimer
        # "Gubernaut is not injection-proof" must not trip "injection-proof".
        run: python tools/claims_check.py --self-test

      - name: Check the repository
        run: python tools/claims_check.py

name: Bug report
description: Something behaves differently than documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems do not go here.** Use
        [private reporting](https://github.com/thegubernaut/gubernaut/security/advisories/new)
        or email contact@gubernaut.com. Fail-opens, boundary crossings and credential leaks
        are all security problems. See [SECURITY.md](../blob/main/SECURITY.md).

        Known limits are in [docs/LIMITS.md](../blob/main/docs/LIMITS.md) and are worth
        reading first, particularly the injection scope and the sensor's recall gap.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the posture from the `x-gcc-posture` header if the request path is involved.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where that is documented
      description: A link to the README, a doc or a docstring helps a great deal.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The controller is deterministic, so a reproduction usually is too. The smaller the better.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "gubernaut-sdk 1.0.0, Ubuntu 24.04, Python 3.12.3"
    validations:
      required: true

  - type: dropdown
    id: config
    attributes:
      label: Default GCCConfig?
      options:
        - "Yes, defaults"
        - "No, modified"
    validations:
      required: true

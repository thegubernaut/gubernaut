name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q

  rust:
    name: rust + wasm target
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - name: cargo test
        # 73 value-exact golden steps + 8 boundary rejections against the
        # Python reference.
        run: cargo test
      - name: build wasm32
        run: cargo build --release --target wasm32-unknown-unknown

  parity:
    name: golden traces are current
    # If the Python controller moved and the golden corpus was not
    # regenerated, the two languages have silently diverged. This catches it
    # at the source rather than waiting for cargo test to fail cryptically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: packages/python
      - run: python tools/gen_golden_traces.py
        working-directory: packages/python
      - name: traces must be unchanged
        run: |
          if ! git diff --quiet -- packages/rust/tests/golden/traces.jsonl; then
            echo "::error::The golden traces regenerate differently than committed."
            echo "The Python controller changed without regenerating the corpus."
            echo "Run: cd packages/python && python tools/gen_golden_traces.py"
            git diff --stat -- packages/rust/tests/golden/traces.jsonl
            exit 1
          fi
          echo "golden traces current"

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # Two different claims, tested separately.
    #
    # `engines: >=18` is a promise about the PUBLISHED artifact, which tsup
    # compiles to plain JS targeting node18. That promise is kept or broken by
    # dist/, so dist/ is what gets loaded on the floor version.
    #
    # The test suite is a different thing: it imports the .ts sources directly
    # through `node --test`, which needs native type stripping and therefore
    # Node >= 22.6. The first version of this job ran `npm test` on Node 20 and
    # failed with ERR_UNKNOWN_FILE_EXTENSION, because it had only ever been run
    # on a machine with a much newer Node. Raising the floor to hide that would
    # have weakened a real claim to make a badge green.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: the published artifact must load on the declared engine floor
        # Both name sets are checked. The gcc* names are the published 1.0.0
        # surface and dropping one would break every existing dependent; the
        # gubernaut* names are the 1.0.1 aliases the docs now lead with, and an
        # alias missing from the BUILD would pass the source tests and still
        # ship broken.
        run: |
          node -e "import('./dist/index.js').then(m => {
            const need = ['gccPlugin', 'callGcc', 'loadConfig', 'gubernautPlugin', 'callGubernaut'];
            const missing = need.filter(k => !(k in m));
            if (missing.length) { console.error('missing exports:', missing); process.exit(1); }
            if (m.gubernautPlugin !== m.gccPlugin) { console.error('gubernautPlugin is not gccPlugin'); process.exit(1); }
            if (m.callGubernaut !== m.callGcc) { console.error('callGubernaut is not callGcc'); process.exit(1); }
            console.log('dist/index.js loads on node ' + process.version);
          }).catch(e => { console.error(e.message); process.exit(1); })"
      - name: require() the CJS build too
        run: node -e "const m=require('./dist/index.cjs'); if(!m.gccPlugin||!m.gubernautPlugin) process.exit(1); if(m.gubernautPlugin!==m.gccPlugin) process.exit(1); console.log('dist/index.cjs loads')"
      - name: test suite (needs native type stripping, Node >= 22.6)
        if: matrix.node != '20'
        run: npm test
      - run: npm run typecheck
